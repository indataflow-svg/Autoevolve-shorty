# nginx: the only thing the world talks to. Free, static, boring — on purpose.
#
# Jobs: terminate 1000 idle keepalives cheaply, serve /assets without waking
# Python, gzip JSON, and rate-limit the write paths that serialize on SQLite.
# Reads (/company/ui/*, /company/*/GET) get a generous bucket; founder-gated
# writes (POST/PATCH/PUT/DELETE) get a tight one. 429s surface as honest
# "slow down", never silent drops.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $time_local "$request" $status $body_bytes_sent "$http_referer" rt=$request_time up=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 25m; # CSV imports + asset uploads
    client_body_timeout 30s;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_comp_level 5;

    # Buckets. Reads are cheap (SQLite WAL concurrent readers). Writes
    # serialize — 5/s per IP with bursts absorbed, the rest get 429 + Retry-After.
    limit_req_zone $binary_remote_addr zone=reads:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=writes:20m rate=5r/s;
    limit_req_status 429;

    upstream api {
        # api replicas join here via compose --scale api=N (same DNS name,
        # round-robin). Keepalive to workers avoids handshake churn.
        server api:8787 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Optional TLS server blocks written by deploy/enable-tls.sh. A wildcard
    # include matching no files is not an error, so plain-HTTP installs are
    # unaffected.
    include /etc/nginx/sites/*.conf;

    server {
        listen 80;
        server_name _;

        # ACME HTTP-01 challenge, served from a shared webroot so certbot never
        # needs to stop nginx. A TLS server block dropped into
        # /etc/nginx/sites/ (see deploy/enable-tls.sh) takes over 443.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            access_log off;
        }

        # Routes shared with the generated TLS server block.
        include /etc/nginx/app-locations.conf;
    }
}
