# Production infra: one box, 1000 simultaneous users, same app content
#
# Recommendation: ONE host first (not many small ones). Why: SQLite lives on
# local disk and cannot be shared across hosts. On one host, N uvicorn
# workers share it fine (WAL = concurrent readers, brief serialized writes).
# Many small hosts would force a Postgres migration — a content change, and
# explicitly out of scope for this step.
#
# What 1000 simultaneous users really means: ~1000 mostly-idle keepalive
# connections, tens of active requests at any instant. This stack handles
# that: nginx (free) terminates connections + serves statics + rate-limits
# writes; 4-8 api workers share the request load; the single GPU serves the
# local AI gateway with bounded parallelism (LLM tokens queue — see limits).
#
# Honest limits of this step (no code changes by design):
# - Sustained write bursts (>~50 writes/s) will serialize on SQLite. Reads
#   scale with workers; writes do not. When p95 POST latency climbs, the
#   next step is Postgres — prepared for, not included here.
# - 1000 users hitting "Generate plan" at once will queue at Ollama. The
#   gateway env already supports pointing at external OmniRoute instead.
# - FFmpeg renders are CPU-bound; cap concurrent renders via governance
#   limits (already in-app), not infra.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      # - "443:443"  # enable with ./deploy/enable-tls.sh (certbot) when you own a domain
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Hashed bundle served from disk: zero Python per asset request.
      # Built by `npm --prefix autoevolve-ui run build` (or the Dockerfile).
      - ../autoevolve-ui/dist:/srv/ui:ro
      # ACME webroot + generated TLS server blocks (deploy/enable-tls.sh).
      - ./nginx-app.conf:/etc/nginx/app-locations.conf:ro
      - ./certbot-www:/var/www/certbot:ro
      - ./tls:/etc/nginx/tls:ro
      - ./tls-sites:/etc/nginx/sites:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    # Same content, same CMD as the Dockerfile. No --reload in prod.
    # Internal port only: the world talks to nginx, never to uvicorn.
    expose:
      - "8787"
    env_file: ../.env
    environment:
      # nginx overwrites X-Forwarded-For with the real peer address, so the app
      # can key its per-client limits on it. Without this, every user behind the
      # proxy shares one bucket (the proxy's IP).
      RATE_LIMIT_TRUST_PROXY: "true"
      # Point model calls at the on-box GPU gateway (or external OmniRoute).
      OMNIROUTE_BASE_URL: http://ollama:11434/v1
      OMNIROUTE_API_KEY: ollama
      MODEL_FAST: llama3.2
      MODEL_REASONING: llama3.2
      MODEL_FREE: llama3.2
      MODEL_CODING: llama3.2
      MODEL_VISION: llama3.2
      CODING_BASE_URL: http://ollama:11434/v1
      CODING_API_KEY: ollama
      CODING_DEFAULT_MODEL: llama3.2
    volumes:
      # Single host, single disk: every worker sees the same SQLite files.
      - ../data:/app/data
      - ../projects:/app/projects
      - ../config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Single-GPU local AI gateway. Start only on the GPU box:
  #   docker compose -f deploy/compose.prod.yaml --profile gpu up -d --scale api=6
  # Without --profile gpu, the app still runs (point the OMNIROUTE_* env above
  # at an external gateway instead).
  ollama:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:11434:11434" # loopback only; api reaches it as http://ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Bounded parallelism: LLM tokens queue instead of OOMing the GPU.
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_QUEUE: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  ollama-models:
