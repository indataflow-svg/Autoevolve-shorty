# Shared routes, included by the HTTP server in nginx.conf and by the TLS
# server block that enable-tls.sh generates. One definition, no drift.

# Static bundle: read straight from disk, never touch Python. Vite
# fingerprints every filename, so a one-year immutable cache is safe; the SPA
# shell (index.html) stays proxied and no-store (set by the app).
location /assets/ {
    alias /srv/ui/assets/;
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Signed media links for an external scheduler. No dashboard auth: the
# short-lived HMAC token is the credential. Still rate-limited per client.
location /public/manual-posts/ {
    limit_req zone=reads burst=60 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-AutoEvolve-Client-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Read paths: generous bucket.
location ~ ^/company/(ui|commercial/(offers|icps|accounts|pipelines|rules|integrations|imports|benchmarks|network-stats|sessions)|sales/companies|sales/contacts|marketing|setup/buffer) {
    limit_req zone=reads burst=200 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Cloudflare Tunnel supplies CF-Connecting-IP. The app prefers the
    # explicit header and falls back to the peer when it is absent. Do not
    # trust a client-supplied forwarded chain at a public origin.
    proxy_set_header X-AutoEvolve-Client-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# Everything else (writes, webhooks, auth): tight bucket.
location / {
    limit_req zone=writes burst=20 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Cloudflare Tunnel visitor IP; the app prefers the explicit header.
    proxy_set_header X-AutoEvolve-Client-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s; # model-backed actions + renders are slow
}
